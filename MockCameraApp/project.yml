name: MockCameraApp
options:
  bundleIdPrefix: com.example.vcam
  deploymentTarget:
    iOS: "16.0"
targets:
  MockCameraApp:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: "MockCamera"
        CFBundleIdentifier: "com.example.vcam.MockCameraApp"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: "Ứng dụng cần quyền Camera để hiển thị và kiểm thử luồng hình ảnh."
        NSPhotoLibraryUsageDescription: "Ứng dụng cần quyền truy cập Album để nạp video/ảnh giả lập."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
