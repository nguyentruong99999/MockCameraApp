name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Install XcodeGen & Generate Project
      run: |
        brew install xcodegen
        cd MockCameraApp
        xcodegen generate

    - name: Build App Payload
      run: |
        cd MockCameraApp
        xcodebuild build \
          -project MockCameraApp.xcodeproj \
          -scheme MockCameraApp \
          -sdk iphoneos \
          -configuration Debug \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          COMPILER_INDEX_STORE_ENABLE=NO | grep -A 5 -B 2 "error:" || true

    - name: Package IPA
      run: |
        cd MockCameraApp
        APP_PATH=$(find build -name "*.app" 2>/dev/null | head -n 1)
        if [ -n "$APP_PATH" ]; then
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -r MockCameraApp.ipa Payload
        fi

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MockCameraApp-IPA
        path: MockCameraApp/build/MockCameraApp.ipa
