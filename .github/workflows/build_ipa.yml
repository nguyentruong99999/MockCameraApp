name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Install XcodeGen & Generate Project
      run: |
        brew install xcodegen
        cd MockCameraApp
        xcodegen generate

    - name: Build App Payload (Debug Mode)
      run: |
        cd MockCameraApp
        xcodebuild build \
          -project MockCameraApp.xcodeproj \
          -scheme MockCameraApp \
          -sdk iphoneos \
          -configuration Debug \
          -derivedDataPath build/DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          COMPILER_INDEX_STORE_ENABLE=NO

    - name: Package IPA
      run: |
        cd MockCameraApp
        APP_PATH=$(find build/DerivedData -name "*.app" | head -n 1)
        
        if [ -z "$APP_PATH" ]; then
          echo "Error: Khong tim thay file .app"
          exit 1
        fi
        
        mkdir -p build/Payload
        cp -R "$APP_PATH" build/Payload/
        cd build
        zip -r MockCameraApp.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MockCameraApp-IPA
        path: MockCameraApp/build/MockCameraApp.ipa
