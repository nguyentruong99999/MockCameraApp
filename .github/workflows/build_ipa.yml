name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Install XcodeGen & Generate Project
      run: |
        brew install xcodegen
        cd MockCameraApp
        xcodegen generate

    - name: Build Archive
      run: |
        cd MockCameraApp
        xcodebuild archive \
          -project MockCameraApp.xcodeproj \
          -scheme MockCameraApp \
          -destination 'generic/platform=iOS' \
          -archivePath build/MockCameraApp.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          SWIFT_COMPILATION_MODE=singlefile \
          SWIFT_OPTIMIZATION_LEVEL=-Onone | grep -E "error:|FAILED" || true

    - name: Package IPA
      run: |
        cd MockCameraApp
        mkdir -p build/Payload
        cp -R build/MockCameraApp.xcarchive/Products/Applications/*.app build/Payload/ 2>/dev/null || true
        cd build
        zip -r MockCameraApp.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MockCameraApp-IPA
        path: MockCameraApp/build/MockCameraApp.ipa
