name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Install XcodeGen & Generate Project
      run: |
        brew install xcodegen
        cd MockCameraApp
        xcodegen generate

    - name: Build App
      run: |
        cd MockCameraApp
        xcodebuild build \
          -project MockCameraApp.xcodeproj \
          -scheme MockCameraApp \
          -sdk iphoneos \
          -configuration Debug \
          -derivedDataPath build/DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO

    - name: Package IPA
      run: |
        # Tìm file .app trong toàn bộ ổ đĩa làm việc
        APP_PATH=$(find . -name "*.app" -type d | head -n 1)
        
        if [ -z "$APP_PATH" ]; then
          echo "Không tìm thấy file .app nào sau khi build!"
          exit 1
        fi
        
        echo "Đã tìm thấy app tại: $APP_PATH"
        
        mkdir -p build_output/Payload
        cp -R "$APP_PATH" build_output/Payload/
        cd build_output
        zip -r MockCameraApp.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MockCameraApp-IPA
        path: build_output/MockCameraApp.ipa
