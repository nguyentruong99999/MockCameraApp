name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Find Project and Build Archive
      run: |
        # Tự động tìm vị trí file .xcodeproj trong repository
        PROJ_PATH=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
        PROJ_DIR=$(dirname "$PROJ_PATH")
        PROJ_NAME=$(basename "$PROJ_PATH")
        
        echo "Found project at: $PROJ_PATH"
        cd "$PROJ_DIR"
        
        # Tạo thư mục build
        mkdir -p build
        
        # Chạy lệnh Archive
        xcodebuild archive \
          -project "$PROJ_NAME" \
          -scheme MockCameraApp \
          -destination 'generic/platform=iOS' \
          -archivePath build/MockCameraApp.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO

    - name: Package IPA
      run: |
        PROJ_PATH=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
        PROJ_DIR=$(dirname "$PROJ_PATH")
        cd "$PROJ_DIR"
        
        mkdir -p build/Payload
        cp -R build/MockCameraApp.xcarchive/Products/Applications/*.app build/Payload/
        cd build
        zip -r MockCameraApp.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MockCameraApp-IPA
        path: "**/build/MockCameraApp.ipa"
